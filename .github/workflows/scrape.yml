name: Actualizar precios diario

# Corre en la nube, sin depender de ninguna PC:
#   - Chedraui y HEB responden bien desde las IPs de GitHub Actions.
#   - Comer va detras de Cloudflare; comer.py usa cloudscraper para pasarlo.
# Si alguna tienda llegara a fallar un dia, run.py conserva su ultimo dato
# bueno y lo marca "stale" (no borra precios), asi que el sitio no se rompe.
on:
  schedule:
    - cron: "0 14 * * *"   # 14:00 UTC = 08:00 hora de Aguascalientes (UTC-6).
                           # GitHub puede retrasar el cron algunos minutos.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr scraper
        run: python scraper/run.py

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Actualiza precios $(date +%Y-%m-%d)"
          git push
