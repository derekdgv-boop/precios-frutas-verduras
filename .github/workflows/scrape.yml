name: Actualizar precios diario

# Actualizacion diaria en la nube, sin depender de ninguna PC:
#   - Chedraui y HEB responden bien desde las IPs de GitHub Actions.
#   - Comer se OMITE aqui (SCRAPER_SKIP): su Cloudflare bloquea IPs de
#     datacenter. Comer se refresca aparte desde una PC residencial
#     (scripts/actualizar_precios.ps1). Mientras tanto conserva su ultimo
#     dato bueno y se marca "stale" en la UI (no se borran precios).
on:
  schedule:
    - cron: "0 14 * * *"   # 14:00 UTC = 08:00 hora de Aguascalientes (UTC-6).
                           # GitHub puede retrasar el cron algunos minutos.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr scraper (sin Comer)
        env:
          SCRAPER_SKIP: Comer
        run: python scraper/run.py

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Actualiza precios $(date +%Y-%m-%d)"
            # La PC tambien pushea (Comer); reintegra por si el remoto avanzo.
            git pull --rebase --autostash origin main
            git push
          fi
