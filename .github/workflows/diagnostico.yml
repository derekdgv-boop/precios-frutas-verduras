name: Diagnostico anti-bot (temporal)

# Prueba si HEB y La Comer bloquean la IP de GitHub Actions o solo rechazan
# por headers/TLS. Imprime status, headers anti-bot y muestra del body para
# cada fuente. Chedraui va de control (deberia responder siempre).
# Correr manualmente desde la pestana Actions. Borrar cuando ya decidamos.

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar requests
        run: pip install requests

      - name: Sondear fuentes
        run: |
          python - <<'PY'
          import requests, json

          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          HDRS_MIN = {"User-Agent": "Mozilla/5.0"}
          HDRS_RICH = {
              "User-Agent": UA,
              "Accept": "application/json, text/plain, */*",
              "Accept-Language": "es-MX,es;q=0.9",
              "Referer": "https://www.google.com/",
          }

          FUENTES = {
              "Chedraui (control)": "https://www.chedraui.com.mx/api/catalog_system/pub/products/search/supermercado/frutas-y-verduras?_from=0&_to=4",
              "HEB": "https://www.heb.com.mx/api/categories/frutas-y-verduras?storeId=hebmx002959&page=1&hitsPerPage=5",
              "Comer": "https://www.lacomer.com.mx/lacomer-api/api/v1/public/articulopasillo/articulospasillord?agruVirtual=0&filtroSeleccionado=0&idPromocion=0&marca=&noPagina=1&numResultados=5&orden=-1&padreId=14&parmInt=1&pasId=13&pasiPort=0&precio=&succId=430",
          }
          ANTIBOT = ("server", "cf-ray", "cf-mitigated", "x-iinfo", "x-cdn", "set-cookie", "retry-after")

          def sondear(nombre, url, headers, etiqueta):
              print(f"\n===== {nombre} [{etiqueta}] =====")
              try:
                  r = requests.get(url, headers=headers, timeout=30)
              except Exception as e:
                  print(f"  EXCEPCION: {e!r}")
                  return
              print(f"  status: {r.status_code}  len: {len(r.content)}")
              for h in ANTIBOT:
                  if h in r.headers:
                      print(f"  {h}: {r.headers[h][:120]}")
              cuerpo = r.text[:300].replace("\n", " ")
              print(f"  body[:300]: {cuerpo}")
              try:
                  data = r.json()
                  n = len(data) if isinstance(data, list) else len(data.get("products") or data.get("vecArticulo") or [])
                  print(f"  JSON OK, items ~ {n}")
              except Exception:
                  print("  (body no es JSON parseable)")

          for nombre, url in FUENTES.items():
              sondear(nombre, url, HDRS_MIN, "headers-min")
              sondear(nombre, url, HDRS_RICH, "headers-ricos")
          PY
